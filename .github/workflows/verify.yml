name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: Upload development JAR and test reports (requires available artifact quota)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported floor: Server 2026.1 LTA ships Plugin API 13.4.3 (the pom default); its scanners may run Java 17.
          - target: 2026.1 LTA floor, JDK 17
            java: '17'
            maven-args: ''
            primary: true
          # Current LTA: Server 2026.5 ships Plugin API 14.0.0.4498.
          - target: 2026.5 LTA API, JDK 21
            java: '21'
            maven-args: -Dsonar.api.version=14.0.0.4498
            primary: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and package native plugin
        run: mvn --batch-mode --no-transfer-progress verify ${{ matrix.maven-args }}
      - name: Check local documentation links
        if: matrix.primary
        run: python3 scripts/check_docs.py
      - name: Retain development JAR and test evidence
        if: always() && matrix.primary && github.event_name == 'workflow_dispatch' && inputs.upload_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-build
          path: |
            target/*.jar
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
