name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: Upload development JAR and test reports (requires available artifact quota)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package native plugin
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Check local documentation links
        run: python3 scripts/check_docs.py
      - name: Retain development JAR and test evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-build
          path: |
            sonar-gdscript-plugin/target/*.jar
            */target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
